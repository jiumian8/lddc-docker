services:
  lddc:
    image: ghcr.io/jiumian8/lddc-docker:latest
    container_name: lddc-docker
    ports:
      - "1122:8080"
    volumes:
      # Linux/NAS 宿主机路径 : 容器内路径；修改左侧为实际音乐目录。
      - "/volume2/jiumian/音乐:/music"
      # 如需将歌词保存到独立目录，取消下一行注释并在 WebUI 填 /lyrics。
      # - "/volume2/jiumian/歌词:/lyrics"
      - "./data:/data"
    environment:
      TZ: Asia/Shanghai
      MUSIC_ROOT: /music
      STATE_DIR: /data
      ALLOWED_ROOTS: "/music,/data,/lyrics"
      # 通过 HTTPS 反向代理访问时设置为 "true"。
      # COOKIE_SECURE: "true"
    restart: unless-stopped
