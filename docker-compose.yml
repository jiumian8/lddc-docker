services:
  lddc:
    build: .
    image: ghcr.io/你的用户名/lddc-docker:latest
    container_name: lddc-docker
    ports:
      - "8080:8080"
    volumes:
      # 修改左侧为宿主机音乐目录；右侧固定为容器路径
      - "./music:/music"
      - "./data:/data"
    environment:
      TZ: Asia/Shanghai
      # 0 表示只手动扫描；例如 360 表示每 6 小时扫描一次
      SCAN_INTERVAL_MINUTES: "360"
      MUSIC_ROOT: /music
      STATE_DIR: /data
    restart: unless-stopped
