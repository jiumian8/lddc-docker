<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LDDC Docker</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">LYRICS AUTOMATION</span><h1>LDDC <em>Docker</em></h1><p>逐词歌词扫描、匹配与自动刮削</p></div><div class="orb">♫</div></header>
<section class="grid"><article class="card hero"><div class="card-title"><span>扫描任务</span><span id="health" class="pill">连接中</span></div><label>目录路径<input id="path" value="/music"></label><div class="row"><label class="check"><input id="overwrite" type="checkbox"> 覆盖已有逐词歌词</label><button id="scan">开始扫描</button></div><div id="progress" class="progress"><i></i></div><p class="hint">容器内路径。Windows 请用 compose 将音乐目录挂载到 /music。</p></article>
<article class="card stats"><div class="card-title"><span>最近一次运行</span><span id="time">—</span></div><div class="statrow"><strong id="scanned">0</strong><span>扫描音频</span></div><div class="statrow"><strong id="updated">0</strong><span>已更新歌词</span></div><div class="statrow"><strong id="errors">0</strong><span>错误</span></div></article></section>
<section class="card log"><div class="card-title"><span>运行日志</span><span id="interval"></span></div><pre id="log">等待任务…</pre></section><footer>Sources: QQ Music · Kugou · Netease · LRCLIB</footer></main><script src="/static/app.js"></script></body></html>
